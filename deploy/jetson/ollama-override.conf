# systemd drop-in for ollama.service on the Jetson Orin Nano 8 GB.
# install.sh copies it to /etc/systemd/system/ollama.service.d/glydi.conf
# (replacing OLLAMA_KEEP_ALIVE if GLYDI_OLLAMA_KEEP_ALIVE was given), then
# `systemctl daemon-reload && systemctl restart ollama`. By hand: the
# same, then `systemctl show ollama -p Environment` to confirm and
# `ollama ps` (UNTIL should read "Forever").
#
# Context length is not here: it is a per-model parameter
# (PARAMETER num_ctx 2048 in deploy/jetson/Modelfile), and glydi sends no
# num_ctx of its own, so the Modelfile value is what the server uses.
[Service]
# Resident for good. A load costs 41 s to the first token, a resident
# model 73 ms, and a foyer is quiet for longer than Ollama's 5-minute
# default between visitors.
Environment="OLLAMA_KEEP_ALIVE=-1"
# One model in memory, ever; a second 1.5b beside it is another ~1.4 GB.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
# One request at a time: glydi serialises its turns anyway, and each
# parallel slot would multiply the KV cache.
Environment="OLLAMA_NUM_PARALLEL=1"
# Flash attention: less memory and a faster prefill on the Ampere GPU.
Environment="OLLAMA_FLASH_ATTENTION=1"
# 8-bit KV cache (needs flash attention): halves the cache against f16
# with no measurable loss at 2048 tokens. ~0.1 GB for 1.5b at num_ctx
# 2048 instead of ~0.2 GB.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
