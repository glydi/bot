[package]
name = "sense-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Feed frames from a WAV file or a synthetic generator instead of the
# microphone, so CI can run the whole pipeline without hardware.
mock = []

[dependencies]
common = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
cpal = { workspace = true }
hound = { workspace = true }
ort = { workspace = true }
whisper-rs = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# No Metal backend: ggml's Metal device aborts in a static destructor when
# the process exits with a whisper context still alive (an AppKit Cmd-Q
# does exactly that), and tiny.en on the CPU transcribes an utterance in
# well under a second, which is what the Python build shipped with.
whisper-rs = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
