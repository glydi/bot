[package]
name = "sense-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Feed frames from a WAV file or a synthetic generator instead of the
# microphone, so CI can run the whole pipeline without hardware.
mock = []

[dependencies]
common = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
cpal = { workspace = true }
hound = { workspace = true }
ort = { workspace = true }
whisper-rs = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Metal: whisper.cpp pads every call to 30 s, so tiny.en on the CPU costs
# 1-3 s per utterance however short it is (measured: a 5.6 s clip took
# 3.4 s, and utterances were dropped while the worker was busy); on the GPU
# it is ~0.3 s. ggml's Metal device aborts in a static destructor if the
# process exits with a context alive -- the binary sidesteps that with an
# atexit hook, see glydi/src/main.rs.
whisper-rs = { workspace = true, features = ["metal"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
