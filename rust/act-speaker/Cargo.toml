[package]
name = "act-speaker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Silence synth + null output so CI exercises ordering, cancellation and the
# self_speaking protocol without a speaker, a model or a helper binary.
mock = []
# Kokoro in-process: ort against libonnxruntime.dylib plus espeak-ng dlopen'd
# for phonemes. Off by default: see the crate docs for why the always-on
# path is the macOS voice.
kokoro = ["dep:ort", "dep:libloading"]

[dependencies]
common = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
cpal = { workspace = true }
ort = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

# A copy of the workspace lints with `unsafe_code` lowered from forbid to
# deny: the espeak-ng FFI module (synth/espeak.rs) allows it locally, with a
# SAFETY comment on every call. Nothing else in the crate may.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
unwrap_used = "deny"
expect_used = "deny"
