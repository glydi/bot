[workspace]
resolver = "3"
members = [
    "common",
    "mind",
    "deliberate",
    "memory",
    "sense-audio",
    "sense-vision",
    "act-speaker",
    "act-ui",
    "glydi",
    "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
common = { path = "common" }
mind = { path = "mind" }

smol_str = "0.3"
smallvec = { version = "1.13", features = ["union"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"

[workspace.lints.rust]
# Sense/actuator crates that need FFI override this per crate, isolating the
# unsafe in one file with SAFETY comments (see ARCHITECTURE.md).
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the style of this codebase more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
# The hard rules from the brief.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
debug = 1
