[workspace]
resolver = "3"
members = [
    "common",
    "mind",
    "deliberate",
    "memory",
    "sense-audio",
    "sense-vision",
    "act-speaker",
    "act-ui",
    "glydi",
    "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
common = { path = "common" }
mind = { path = "mind" }

smol_str = "0.3"
smallvec = { version = "1.13", features = ["union"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
# memory: SQLite with the library compiled in, so the person gallery opens
# the same people.db the Python and Go builds wrote without a system sqlite.
rusqlite = { version = "0.37", features = ["bundled"] }
# deliberate: LLM client (HTTP + SSE streaming), cancellation, stream combinators.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"

# sense-audio
cpal = "0.18"
hound = "3.5"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
# sense-vision: the YOLOv5 release asset is an fp16 export, so its input
# and output tensors are `half::f16` (ort's `half` feature).
half = { version = "2", default-features = false }
whisper-rs = "0.16"

# act-speaker: espeak-ng for the Kokoro phonemizer is dlopen'd (no build-time
# link), the rest of the speaker rides on cpal/ort above.
libloading = "0.8"

# act-ui: the face window. wgpu backend, no glow.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }

# sense-vision: AVFoundation camera capture through the objc2 bindings; the
# FFI is isolated in sense-vision/src/camera.rs.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
dispatch2 = "0.3"
block2 = "0.6"

[workspace.lints.rust]
# Sense/actuator crates that need FFI override this per crate, isolating the
# unsafe in one file with SAFETY comments (see ARCHITECTURE.md).
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the style of this codebase more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
# The hard rules from the brief.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
debug = 1
