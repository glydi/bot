[project]
name = "glydi-bot"
version = "0.1.0"
description = "A voice bot that recognises the people it talks to and remembers their names."
requires-python = ">=3.10"

dependencies = [
    "pipecat-ai[silero,anthropic,webrtc,local-smart-turn,whisper,mlx-whisper,kokoro]>=1.8.1",
    "anthropic>=0.40",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "loguru",
    "numpy",
    "pywebview",  # the face is HTML; WKWebView shows it in Glydi.app
]

[project.optional-dependencies]
# The identity worker's models. Split out so the conversation path can be run
# and profiled (GLYDI_IDENTITY=0) without pulling torch down.
identity = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    # headless, not opencv-python: both ship the same `cv2` package and
    # overwrite each other on disk, and pipecat already depends on headless.
    # We only need VideoCapture, never a GUI window, so headless is sufficient.
    "opencv-python-headless>=4.9",
    "speechbrain>=1.0",
    "torch>=2.2",
    "torchaudio>=2.2",
]
# Hosted speech stack (GLYDI_SPEECH=hosted). Optional -- the default
# local stack needs neither.
hosted-speech = ["pipecat-ai[deepgram,cartesia]>=1.8.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
glydi-bot = "glydi_bot.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
