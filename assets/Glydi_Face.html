.glydi {
  position: relative;
  width: min(520px, 94vw);
  aspect-ratio: 1.0529 / 1;
  overflow: hidden;
  border-radius: 18px;
  transform-origin: 50% 60%;
}

.glydi::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--glydi-shell);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.glydi-eye {
  position: absolute;
  overflow: hidden;
  border-radius: 46% 54% 46% 54% / 55% 58% 42% 45%;
  transform-origin: 50% 55%;
}

.glydi-eye::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--glydi-eye);
  background-size: 100% 100%;
  background-repeat: no-repeat;
}

.glydi-eye.left {
  left: 15.1%;
  top: 29.6%;
  width: 26.65%;
  height: 34.95%;
}

.glydi-eye.right {
  left: 57.8%;
  top: 27%;
  width: 26.65%;
  height: 37.6%;
}

.glydi-smile {
  position: absolute;
  left: 37.2%;
  top: 62.45%;
  width: 25.65%;
  height: 12.75%;
  background-image: var(--glydi-smile);
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  transform-origin: 50% 50%;
}

/* reusable expression pieces */
.glydi-open-mouth,
.glydi-o-mouth,
.glydi-flat-mouth,
.glydi-wavy-mouth,
.glydi-closed-eye,
.glydi-zzz,
.glydi-xeye {
  display: none;
  position: absolute;
}

.glydi-open-mouth,
.glydi-o-mouth,
.glydi-flat-mouth,
.glydi-wavy-mouth {
  left: 50%;
  transform: translateX(-50%);
}

.glydi-open-mouth {
  top: 64.8%;
  width: 12%;
  height: 12%;
  border-radius: 48% 48% 52% 52%;
  background: #121319;
  border: 4px solid var(--glydi-cream);
  box-shadow: inset 0 -9px 0 rgba(255,242,217,.18),
              0 0 7px rgba(255,242,217,.08);
}

.glydi-o-mouth {
  top: 65.2%;
  width: 6.4%;
  height: 8.6%;
  border-radius: 50%;
  background: #111218;
  border: 4px solid var(--glydi-cream);
}

.glydi-flat-mouth {
  top: 68.6%;
  width: 15%;
  height: 5px;
  border-radius: 999px;
  background: var(--glydi-cream);
}

.glydi-wavy-mouth {
  top: 67.3%;
  width: 17%;
  height: 10%;
}

.glydi-wavy-mouth::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 32%;
  height: 6px;
  border-radius: 50%;
  border-top: 5px solid var(--glydi-cream);
  transform: rotate(5deg);
}

.glydi-closed-eye {
  width: 18%;
  height: 9%;
  top: 52.5%;
}

.glydi-closed-eye.left { left: 19.7%; }
.glydi-closed-eye.right { left: 62.7%; }

.glydi-closed-eye::before {
  content: "";
  position: absolute;
  inset: 0;
  border-bottom: 6px solid var(--glydi-cream);
  border-radius: 0 0 55% 55%;
}

.glydi-zzz {
  left: 79%;
  top: 24%;
  font-weight: 800;
  color: #a1a6bb;
  font-size: 8%;
}

.glydi-xeye {
  width: 11%;
  height: 11%;
  top: 47%;
}

.glydi-xeye.left { left: 28%; }
.glydi-xeye.right { left: 62%; }

.glydi-xeye::before,
.glydi-xeye::after {
  content: "";
  position: absolute;
  left: 46%;
  top: 0;
  width: 8%;
  height: 100%;
  border-radius: 999px;
  background: var(--glydi-cream);
}

.glydi-xeye::before { transform: rotate(45deg); }
.glydi-xeye::after { transform: rotate(-45deg); }

@keyframes glydi-float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-1.2%); }
}

@keyframes glydi-blink {
  0%,42%,45%,100% { transform: scaleY(1); }
  43%,44% { transform: scaleY(.06); }
}

@keyframes glydi-listen {
  0%,100% { transform: rotate(-2deg); }
  50% { transform: rotate(2deg); }
}

@keyframes glydi-think {
  0%,100% { transform: rotate(0); }
  50% { transform: rotate(-3deg); }
}

@keyframes glydi-talk-small {
  0%,100% { transform: translateX(-50%) scale(.82,.55); }
  50% { transform: translateX(-50%) scale(1,1); }
}

@keyframes glydi-talk-big {
  0%,100% { transform: translateX(-50%) scale(.88,.7); }
  50% { transform: translateX(-50%) scale(1.05,1.25); }
}

@keyframes glydi-greet {
  0%,100% { transform: translateY(0) scale(1); }
  35% { transform: translateY(-3%) scale(1.02); }
  65% { transform: translateY(.5%) scale(.997); }
}

@keyframes glydi-delight {
  0%,100% { transform: scaleX(1); }
  50% { transform: scaleX(1.08); }
}

@keyframes glydi-curious {
  0%,100% { transform: rotate(-5deg); }
  50% { transform: rotate(4deg); }
}

@keyframes glydi-pop {
  0%,100% { transform: scale(1); }
  28% { transform: scale(1.025); }
  55% { transform: scale(.995); }
}

@keyframes glydi-confuse {
  0%,100% { transform: rotate(-1deg); }
  50% { transform: rotate(2deg); }
}

@keyframes glydi-sleep {
  0%,100% { transform: translateY(.5%) scale(.997); }
  50% { transform: translateY(-.8%) scale(1); }
}

@keyframes glydi-zzz {
  0% { opacity:0; transform:translate(0,8px) scale(.85); }
  35% { opacity:.8; }
  100% { opacity:0; transform:translate(12px,-18px) scale(1.05); }
}

@keyframes glydi-glitch {
  0%,88%,100% { transform:translate(0); }
  90% { transform:translate(-1.5%,0); }
  92% { transform:translate(1.8%,-.3%); }
  94% { transform:translate(-.8%,.2%); }
  96% { transform:translate(.7%,0); }
}

/* IDLE */
.glydi.idle { animation: glydi-float 4.2s ease-in-out infinite; }
.glydi.idle .glydi-eye.left { animation: glydi-blink 5.4s infinite; }
.glydi.idle .glydi-eye.right { animation: glydi-blink 5.4s .02s infinite; }

/* LISTENING */
.glydi.listening { animation: glydi-listen 2.2s ease-in-out infinite; }
.glydi.listening .glydi-eye.left { transform:scale(1.11,1.15) translate(-2%,-2%); }
.glydi.listening .glydi-eye.right { transform:scale(1.11,1.15) translate(2%,-2%); }
.glydi.listening .glydi-smile { transform:scale(.82); top:64.2%; }

/* THINKING */
.glydi.thinking { animation: glydi-think 2.8s ease-in-out infinite; }
.glydi.thinking .glydi-eye.left { height:22%; top:35%; transform:rotate(-5deg) translateX(6%); }
.glydi.thinking .glydi-eye.right { height:22%; top:31.5%; transform:rotate(-5deg) translateX(6%); }
.glydi.thinking .glydi-smile { display:none; }
.glydi.thinking .glydi-flat-mouth { display:block; left:53%; width:10%; transform:rotate(-5deg); }

/* QUIET SPEAK */
.glydi.quiet { animation:glydi-float 3.6s ease-in-out infinite; }
.glydi.quiet .glydi-eye { transform:scaleY(.88); }
.glydi.quiet .glydi-smile { display:none; }
.glydi.quiet .glydi-open-mouth {
  display:block; width:8%; height:6.5%; top:66.7%;
  animation:glydi-talk-small .58s ease-in-out infinite;
}

/* LOUD SPEAK */
.glydi.loud { animation:glydi-float 3.2s ease-in-out infinite; }
.glydi.loud .glydi-eye { transform:scaleY(.95); }
.glydi.loud .glydi-smile { display:none; }
.glydi.loud .glydi-open-mouth {
  display:block; width:14%; height:14%; top:63.3%;
  animation:glydi-talk-big .46s ease-in-out infinite;
}

/* GREETING */
.glydi.greeting { animation:glydi-greet 1.6s ease-in-out infinite; }
.glydi.greeting .glydi-eye { display:none; }
.glydi.greeting .glydi-closed-eye { display:block; }
.glydi.greeting .glydi-closed-eye::before {
  border-bottom:0;
  border-top:6px solid var(--glydi-cream);
  border-radius:55% 55% 0 0;
}
.glydi.greeting .glydi-smile { transform:scale(1.25); top:60.8%; }

/* DELIGHTED */
.glydi.delighted { animation:glydi-delight 2s ease-in-out infinite; }
.glydi.delighted .glydi-eye { display:none; }
.glydi.delighted .glydi-closed-eye { display:block; }
.glydi.delighted .glydi-closed-eye::before {
  border-bottom:0;
  border-top:7px solid var(--glydi-cream);
  border-radius:55% 55% 0 0;
}
.glydi.delighted .glydi-closed-eye.left { top:50%; transform:rotate(-4deg); }
.glydi.delighted .glydi-closed-eye.right { top:50%; transform:rotate(4deg); }
.glydi.delighted .glydi-smile { transform:scale(1.42); top:59.8%; }

/* CURIOUS */
.glydi.curious { animation:glydi-curious 2.8s ease-in-out infinite; }
.glydi.curious .glydi-eye.left { transform:scale(1.18,1.22) translate(-3%,-3%); }
.glydi.curious .glydi-eye.right { height:19%; top:36%; transform:scaleX(.9) rotate(4deg); }
.glydi.curious .glydi-smile { transform:scale(.74) rotate(-8deg); left:39%; top:64%; }

/* SURPRISED */
.glydi.surprised { animation:glydi-pop 2.1s ease-in-out infinite; }
.glydi.surprised .glydi-eye.left { transform:scale(1.22,1.28) translate(-3%,-4%); }
.glydi.surprised .glydi-eye.right { transform:scale(1.22,1.28) translate(3%,-4%); }
.glydi.surprised .glydi-smile { display:none; }
.glydi.surprised .glydi-o-mouth { display:block; }

/* CONFUSED */
.glydi.confused { animation:glydi-confuse 2.5s ease-in-out infinite; }
.glydi.confused .glydi-eye.left { height:18%; top:37%; transform:rotate(-7deg); }
.glydi.confused .glydi-eye.right { transform:scale(1.08,1.08) rotate(5deg) translateY(-2%); }
.glydi.confused .glydi-smile { display:none; }
.glydi.confused .glydi-wavy-mouth { display:block; }

/* ASLEEP */
.glydi.asleep { animation:glydi-sleep 4.5s ease-in-out infinite; }
.glydi.asleep .glydi-eye { display:none; }
.glydi.asleep .glydi-closed-eye { display:block; top:53.5%; }
.glydi.asleep .glydi-smile { transform:scale(.55); top:65%; }
.glydi.asleep .glydi-zzz { display:block; animation:glydi-zzz 2.7s ease-out infinite; }

/* BROKEN */
.glydi.broken { animation:glydi-glitch 2.2s steps(1,end) infinite; }
.glydi.broken .glydi-eye,
.glydi.broken .glydi-smile { display:none; }
.glydi.broken .glydi-xeye { display:block; }
.glydi.broken .glydi-flat-mouth {
  display:block;
  top:68%;
  width:10%;
  transform:rotate(7deg);
}

@media (prefers-reduced-motion: reduce) {
  .glydi, .glydi * {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>
<body>

<div class="glydi idle" id="glydi">
  <span class="glydi-eye left"></span>
  <span class="glydi-eye right"></span>
  <span class="glydi-smile"></span>

  <span class="glydi-open-mouth"></span>
  <span class="glydi-o-mouth"></span>
  <span class="glydi-flat-mouth"></span>
  <span class="glydi-wavy-mouth"></span>

  <span class="glydi-closed-eye left"></span>
  <span class="glydi-closed-eye right"></span>

  <span class="glydi-zzz" aria-hidden="true">zzz</span>

  <span class="glydi-xeye left"></span>
  <span class="glydi-xeye right"></span>
</div>

<script>
(() => {
  const STATES = [
    "idle","listening","thinking","quiet","loud","greeting",
    "delighted","curious","surprised","confused","asleep","broken"
  ];
  const face = document.getElementById("glydi");

  window.Glydi = {
    states: [...STATES],
    setState(state) {
      if (!STATES.includes(state)) {
        throw new Error("Invalid Glydi state: " + state);
      }
      face.className = "glydi " + state;
      return state;
    },
    getState() {
      return STATES.find(s => face.classList.contains(s)) || "idle";
    },
    setSpeaking(level=0) {
      const n = Number(level) || 0;
      if (n <= 0) return this.setState("idle");
      return this.setState(n < 0.55 ? "quiet" : "loud");
    }
  };
})();
</script>

</body>
</html>
