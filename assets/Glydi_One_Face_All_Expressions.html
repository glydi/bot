<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glydi — One Face, All Expressions</title>
<style>
:root {
  --cream:#fff2d9;
  --dark:#17181f;
  --muted:#85899c;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:32px 20px 48px;
  background:#f4f5f7;
  color:#171821;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;
}
.wrap{max-width:1320px;margin:auto}
h1{margin:0 0 6px;font-size:27px;letter-spacing:-.035em}
.lead{margin:0 0 24px;color:var(--muted)}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(275px,1fr));
  gap:18px;
}
.card{
  background:#fff;
  border:1px solid rgba(20,22,32,.07);
  border-radius:24px;
  padding:15px;
  box-shadow:0 14px 34px rgba(21,23,34,.055);
}
.stage{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  aspect-ratio:1.0529/1;
  background:#fff;
}
.face{
  position:absolute; inset:0;
  transform-origin:50% 60%;
}
.shell{
  position:absolute; inset:0;
  width:100%; height:100%; object-fit:cover;
}
.ew{
  position:absolute;
  overflow:hidden;
  border-radius:46% 54% 46% 54% / 55% 58% 42% 45%;
  transform-origin:50% 55%;
}
.ew img{
  position:absolute; inset:0;
  width:100%; height:100%; object-fit:fill;
}
.ew.left{left:15.1%;top:29.6%;width:26.65%;height:34.95%}
.ew.right{left:57.8%;top:27.0%;width:26.65%;height:37.6%}
.smile{
  position:absolute;
  left:37.2%; top:62.45%;
  width:25.65%; height:12.75%;
  object-fit:contain;
  transform-origin:50% 50%;
}
.caption{padding:14px 3px 2px}
.caption b{display:block;font-size:16px;margin-bottom:2px}
.caption span{color:var(--muted);font-size:13px}

/* reusable drawn mouths */
.openMouth,.oMouth,.flatMouth,.wavyMouth{
  display:none;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}
.openMouth{
  top:64.8%;
  width:12%;
  height:12%;
  border-radius:48% 48% 52% 52%;
  background:#121319;
  border:4px solid var(--cream);
  box-shadow:inset 0 -9px 0 rgba(255,242,217,.18),0 0 7px rgba(255,242,217,.08);
}
.oMouth{
  top:65.2%;
  width:6.4%;
  height:8.6%;
  border-radius:50%;
  background:#111218;
  border:4px solid var(--cream);
}
.flatMouth{
  top:68.6%;
  width:15%;
  height:5px;
  border-radius:999px;
  background:var(--cream);
}
.wavyMouth{
  top:67.3%;
  width:17%;
  height:10%;
}
.wavyMouth:before{
  content:"";
  position:absolute;
  left:0;right:0;top:32%;
  height:6px;
  border-radius:50%;
  border-top:5px solid var(--cream);
  transform:rotate(5deg);
}

.closedEye{
  display:none;
  position:absolute;
  width:18%;
  height:9%;
  top:52.5%;
}
.closedEye.left{left:19.7%}
.closedEye.right{left:62.7%}
.closedEye:before{
  content:"";
  position:absolute;
  inset:0;
  border-bottom:6px solid var(--cream);
  border-radius:0 0 55% 55%;
}
.closedEye.happy:before{
  border-bottom:0;
  border-top:6px solid var(--cream);
  border-radius:55% 55% 0 0;
}

.zzz{display:none;position:absolute;left:79%;top:24%;font-weight:800;color:#a1a6bb;font-size:8%;}
.xeye{display:none;position:absolute;width:11%;height:11%;top:47%}
.xeye.left{left:28%} .xeye.right{left:62%}
.xeye:before,.xeye:after{
  content:"";position:absolute;left:46%;top:0;width:8%;height:100%;
  border-radius:999px;background:var(--cream);
}
.xeye:before{transform:rotate(45deg)} .xeye:after{transform:rotate(-45deg)}

/* general animation */
@keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2%)}}
@keyframes blink {0%,42%,45%,100%{transform:scaleY(1)}43%,44%{transform:scaleY(.06)}}
@keyframes listen {0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes thinkTilt {0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
@keyframes talkSmall {0%,100%{transform:translateX(-50%) scale(.82,.55)}50%{transform:translateX(-50%) scale(1,1)}}
@keyframes talkBig {0%,100%{transform:translateX(-50%) scale(.88,.7)}50%{transform:translateX(-50%) scale(1.05,1.25)}}
@keyframes greet {0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-3%) scale(1.02)}65%{transform:translateY(.5%) scale(.997)}}
@keyframes delight {0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}
@keyframes curious {0%,100%{transform:rotate(-5deg)}50%{transform:rotate(4deg)}}
@keyframes pop {0%,100%{transform:scale(1)}28%{transform:scale(1.025)}55%{transform:scale(.995)}}
@keyframes confuse {0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}
@keyframes sleep {0%,100%{transform:translateY(.5%) scale(.997)}50%{transform:translateY(-.8%) scale(1)}}
@keyframes zzz {0%{opacity:0;transform:translate(0,8px) scale(.85)}35%{opacity:.8}100%{opacity:0;transform:translate(12px,-18px) scale(1.05)}}
@keyframes glitch {0%,88%,100%{transform:translate(0)}90%{transform:translate(-1.5%,0)}92%{transform:translate(1.8%,-.3%)}94%{transform:translate(-.8%,.2%)}96%{transform:translate(.7%,0)}}

/* 1 IDLE */
.idle{animation:float 4.2s ease-in-out infinite}
.idle .ew.left{animation:blink 5.4s infinite}
.idle .ew.right{animation:blink 5.4s .02s infinite}

/* 2 LISTENING — visibly wide and focused */
.listening{animation:listen 2.2s ease-in-out infinite}
.listening .ew.left{transform:scale(1.11,1.15) translate(-2%,-2%)}
.listening .ew.right{transform:scale(1.11,1.15) translate(2%,-2%)}
.listening .smile{transform:scale(.82);top:64.2%}

/* 3 THINKING — eyes compressed and shifted up/side, flat mouth */
.thinking{animation:thinkTilt 2.8s ease-in-out infinite}
.thinking .ew.left{height:22%;top:35%;transform:rotate(-5deg) translateX(6%)}
.thinking .ew.right{height:22%;top:31.5%;transform:rotate(-5deg) translateX(6%)}
.thinking .smile{display:none}
.thinking .flatMouth{display:block;left:53%;width:10%;transform:rotate(-5deg)}

/* 4 QUIET SPEAK — mouth open, eyes slightly narrowed */
.quiet{animation:float 3.6s ease-in-out infinite}
.quiet .ew{transform:scaleY(.88)}
.quiet .smile{display:none}
.quiet .openMouth{display:block;width:8%;height:6.5%;top:66.7%;animation:talkSmall .58s ease-in-out infinite}

/* 5 LOUD SPEAK — much bigger mouth */
.loud{animation:float 3.2s ease-in-out infinite}
.loud .ew{transform:scaleY(.95)}
.loud .smile{display:none}
.loud .openMouth{display:block;width:14%;height:14%;top:63.3%;animation:talkBig .46s ease-in-out infinite}

/* 6 GREETING — crescent eyes + big smile + bounce */
.greeting{animation:greet 1.6s ease-in-out infinite}
.greeting .ew{display:none}
.greeting .closedEye{display:block}
.greeting .closedEye:before{border-bottom:0;border-top:6px solid var(--cream);border-radius:55% 55% 0 0}
.greeting .smile{transform:scale(1.25);top:60.8%}

/* 7 DELIGHTED — eyes fully happy, largest smile */
.delighted{animation:delight 2s ease-in-out infinite}
.delighted .ew{display:none}
.delighted .closedEye{display:block}
.delighted .closedEye:before{border-bottom:0;border-top:7px solid var(--cream);border-radius:55% 55% 0 0}
.delighted .closedEye.left{top:50%;transform:rotate(-4deg)}
.delighted .closedEye.right{top:50%;transform:rotate(4deg)}
.delighted .smile{transform:scale(1.42);top:59.8%}

/* 8 CURIOUS — one eye huge, one eye squinted, head tilt */
.curious{animation:curious 2.8s ease-in-out infinite}
.curious .ew.left{transform:scale(1.18,1.22) translate(-3%,-3%)}
.curious .ew.right{height:19%;top:36%;transform:scaleX(.9) rotate(4deg)}
.curious .smile{transform:scale(.74) rotate(-8deg);left:39%;top:64%}

/* 9 SURPRISED — both eyes huge + O mouth */
.surprised{animation:pop 2.1s ease-in-out infinite}
.surprised .ew.left{transform:scale(1.22,1.28) translate(-3%,-4%)}
.surprised .ew.right{transform:scale(1.22,1.28) translate(3%,-4%)}
.surprised .smile{display:none}
.surprised .oMouth{display:block}

/* 10 CONFUSED — asymmetric eye heights + wavy mouth */
.confused{animation:confuse 2.5s ease-in-out infinite}
.confused .ew.left{height:18%;top:37%;transform:rotate(-7deg)}
.confused .ew.right{transform:scale(1.08,1.08) rotate(5deg) translateY(-2%)}
.confused .smile{display:none}
.confused .wavyMouth{display:block}

/* 11 ASLEEP — eyes removed, true closed lids */
.asleep{animation:sleep 4.5s ease-in-out infinite}
.asleep .ew{display:none}
.asleep .closedEye{display:block;top:53.5%}
.asleep .smile{transform:scale(.55);top:65%}
.asleep .zzz{display:block;animation:zzz 2.7s ease-out infinite}

/* 12 BROKEN — X eyes + no smile + glitch */
.broken{animation:glitch 2.2s steps(1,end) infinite}
.broken .ew,.broken .smile{display:none}
.broken .xeye{display:block}
.broken .flatMouth{display:block;top:68%;width:10%;transform:rotate(7deg)}

@media(max-width:620px){body{padding:22px 13px 38px}.grid{grid-template-columns:1fr}}
</style>
<style>
/* Standalone one-face shell */
html, body {
  width: 100%;
  height: 100%;
}
body {
  margin: 0 !important;
  padding: 0 !important;
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: transparent !important;
}
.glydi-root {
  width: min(520px, 94vw);
  aspect-ratio: 1.0529 / 1;
}
.glydi-root .stage {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 18px;
  background: transparent;
}
@media (prefers-reduced-motion: reduce) {
  .glydi-root .face,
  .glydi-root .face *,
  .glydi-root .face *::before,
  .glydi-root .face *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>

<script>

(() => {
  const VALID_STATES = Object.freeze([
    "idle",
    "listening",
    "thinking",
    "quiet",
    "loud",
    "greeting",
    "delighted",
    "curious",
    "surprised",
    "confused",
    "asleep",
    "broken"
  ]);

  const ALIASES = Object.freeze({
    "speaking-quiet": "quiet",
    "speaking_quiet": "quiet",
    "speakingquiet": "quiet",
    "speaking-loud": "loud",
    "speaking_loud": "loud",
    "speakingloud": "loud",
    "listen": "listening",
    "think": "thinking",
    "greet": "greeting",
    "delight": "delighted",
    "sleep": "asleep",
    "error": "broken"
  });

  const root = document.querySelector("[data-glydi-root]");
  const face = root?.querySelector(".face");

  if (!root || !face) {
    console.error("Glydi: face root not found.");
    return;
  }

  let currentState = "idle";
  let demoTimer = null;

  function normalizeState(value) {
    const raw = String(value ?? "").trim().toLowerCase();
    const state = ALIASES[raw] || raw;
    return VALID_STATES.includes(state) ? state : null;
  }

  function setState(nextState) {
    const state = normalizeState(nextState);
    if (!state) {
      throw new Error(
        `Glydi: invalid state "${nextState}". Valid states: ${VALID_STATES.join(", ")}`
      );
    }

    for (const name of VALID_STATES) face.classList.remove(name);
    face.classList.add(state);
    face.dataset.state = state;
    root.dataset.state = state;
    currentState = state;

    root.dispatchEvent(new CustomEvent("glydi:statechange", {
      detail: { state }
    }));

    return state;
  }

  function getState() {
    return currentState;
  }

  function setSpeaking(level = 0.5) {
    const n = Number(level);
    if (!Number.isFinite(n) || n <= 0) return setState("idle");
    return setState(n < 0.55 ? "quiet" : "loud");
  }

  function stopDemo() {
    if (demoTimer) {
      clearInterval(demoTimer);
      demoTimer = null;
    }
  }

  function startDemo(intervalMs = 1800) {
    stopDemo();
    let index = Math.max(0, VALID_STATES.indexOf(currentState));
    demoTimer = setInterval(() => {
      index = (index + 1) % VALID_STATES.length;
      setState(VALID_STATES[index]);
    }, Math.max(400, Number(intervalMs) || 1800));
  }

  function reset() {
    stopDemo();
    return setState("idle");
  }

  window.Glydi = Object.freeze({
    states: VALID_STATES,
    setState,
    getState,
    setSpeaking,
    startDemo,
    stopDemo,
    reset,
    element: root
  });

  setState("idle");
})();

</script>
